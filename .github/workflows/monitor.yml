name: Einführungsseminar-Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (UTC); GitHub startet geplante Läufe oft einige Minuten später
  workflow_dispatch:          # manueller Start über "Run workflow"

permissions:
  contents: write             # zum Zurückschreiben von state.json

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Seite prüfen
        run: python monitor.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_OTHER_EVENTS: "1"

      - name: Zustand sichern
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Zustand aktualisiert"
            git pull --rebase
            git push
          fi
